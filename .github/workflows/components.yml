name: Component safeguards

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: components-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, architecture, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp check
      - run: vp dlx sv check
      - run: vp run check:components
      - run: vp test
      - run: vp build

  storybook-build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp run storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  storybook-tests:
    name: Stories and accessibility
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp exec playwright install chromium
      - run: vp run test:stories

  playwright:
    name: Playwright (${{ matrix.shard }}/${{ matrix.total }})
    needs: storybook-build
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp exec playwright install chromium firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - run:
          vp exec playwright test --max-failures=1 --retries=0
          --reporter=list,blob --shard=${{ matrix.shard }}/${{ matrix.total }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pw-blob-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-fail-${{ matrix.shard }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  playwright-report:
    name: Merge Playwright report
    if: ${{ !cancelled() && needs.playwright.result != 'skipped' }}
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - uses: actions/download-artifact@v4
        with:
          pattern: pw-blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: vp exec playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: pw-report
          path: playwright-report
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  pr-results:
    name: Publish PR results
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - quality
      - storybook-build
      - storybook-tests
      - playwright
      - playwright-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- component-safeguards-results -->'
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issueNumber = context.payload.pull_request.number
            const headSha = context.payload.pull_request.head.sha
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${headSha}`

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: context.runId,
                filter: 'latest',
                per_page: 100
              }
            )
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100
              }
            )

            const expectedJobs = [
              'Types, architecture, tests, and build',
              'Build Storybook',
              'Stories and accessibility',
              'Playwright (1/4)',
              'Playwright (2/4)',
              'Playwright (3/4)',
              'Playwright (4/4)',
              'Merge Playwright report'
            ]
            const selectedJobs = expectedJobs.map((name) => ({
              name,
              job: jobs.find((candidate) => candidate.name === name)
            }))
            const symbols = {
              success: '✅',
              failure: '❌',
              cancelled: '⏹️',
              skipped: '⏭️',
              timed_out: '⏱️',
              action_required: '⚠️',
              startup_failure: '❌'
            }
            const failureConclusions = new Set([
              'failure',
              'timed_out',
              'action_required',
              'startup_failure'
            ])
            const conclusions = selectedJobs.map(({ job }) =>
              job?.conclusion ?? 'missing'
            )
            const overall = conclusions.some((value) =>
              failureConclusions.has(value)
            )
              ? '❌ Some safeguards failed'
              : conclusions.some((value) => value === 'cancelled')
                ? '⏹️ Safeguards were cancelled'
                : conclusions.some((value) =>
                      ['missing', 'skipped'].includes(value)
                    )
                  ? '⚠️ Safeguards did not fully run'
                  : '✅ All safeguards passed'

            const duration = (job) => {
              if (!job?.started_at || !job?.completed_at) return '—'
              const elapsed =
                new Date(job.completed_at).getTime() -
                new Date(job.started_at).getTime()
              const seconds = Math.max(0, Math.round(elapsed / 1000))
              const minutes = Math.floor(seconds / 60)
              const remainder = seconds % 60
              return minutes > 0 ? `${minutes}m ${remainder}s` : `${seconds}s`
            }
            const rows = selectedJobs.map(({ name, job }) => {
              if (!job) return `| ${name} | ⚪ Missing | — |`
              const conclusion = job.conclusion ?? job.status
              const result = `${symbols[conclusion] ?? '⏳'} ${conclusion}`
              return `| [${name}](${job.html_url}) | ${result} | ${duration(job)} |`
            })
            const availableArtifacts = artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => `\`${artifact.name}\``)
              .sort()
            const artifactSummary = availableArtifacts.length
              ? `${availableArtifacts.join(', ')} ([download](${runUrl}#artifacts))`
              : `None ([workflow run](${runUrl}))`

            const body = [
              marker,
              '## Component safeguard results',
              '',
              `**Overall:** ${overall}`,
              '',
              `PR head: [\`${headSha.slice(0, 7)}\`](${commitUrl}) · Tested merge: \`${context.sha.slice(0, 7)}\` · [Workflow run](${runUrl})`,
              '',
              '| Check | Result | Duration |',
              '| --- | --- | ---: |',
              ...rows,
              '',
              `**Artifacts:** ${artifactSummary}`,
              '',
              '_This comment is updated automatically for each component-safeguards run._'
            ].join('\n')

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            )
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            try {
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body
                })
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body
                })
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  'The pull request token is read-only; skipping the results comment.'
                )
              } else {
                throw error
              }
            }
